services:
  frontend:
    image: payment-dashboard-fe
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - dev-network

  backend:
    image: payment-dashboard-be
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HTTP_ADDR=:8080
      - OPENAPIYAML_LOCATION=./openapi.yaml
      - JWT_SECRET=your-very-secret
      - JWT_EXPIRED=24h
      - FRONTEND_URL=http://localhost:5173
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
