root = "."
tmp_dir = "tmp"

[build]
  # Build command
  cmd = "go build -o ./tmp/main ."
  # Binary to execute
  bin = "./tmp/main"
  # Watch for these extensions
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json", "env"]
  # Exclude these directories
  exclude_dir = ["assets", "tmp", "vendor"]
  # Exclude these specific files
  exclude_file = []
  # Delay before building (ms)
  delay = 1000
  # Stop running old binary when build errors occur
  stop_on_error = true
  # Send Interrupt signal before killing process
  send_interrupt = false
  # Delay after sending Interrupt signal
  kill_delay = 500

[log]
  # Show log time
  time = false

[color]
  # Customize colors
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Delete tmp directory on exit
  clean_on_exit = true
